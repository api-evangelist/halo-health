name: Halo Health
description: Halo Mental Health (Halo Health) operates same-day mental health urgent
  care clinics, offering immediate psychiatric assessments, medication management,
  crisis intervention, individual and group therapy, and teletherapy for adults and
  children ages eight and older. Founded by Paul Manley with medical director Dr. Vahid
  Osman, the Joint Commission-accredited provider runs clinics in Central Las Vegas
  and Summerlin, accepts commercial insurance and Medicaid, and is building the largest
  network of urgent cares dedicated to same-day mental health services. Backed by 8vc.
  Halo Health publishes no public API or developer platform; this profile captures
  its identity, web presence, and domain security posture.
